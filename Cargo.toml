[package]
name = "yorunix"
version = "0.0.1"
edition = "2021"
description = "YoRunix microkernel core in Rust (no_std, 32-bit x86), linked with NASM stubs"
license = "BSD 3-Clause"

[lib]
name = "yorunix"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2

# Note: cargo ignores `panic` in the `test` profile and forces unwind — the
# libtest harness needs it to report failures (a failed assert records the test
# as failed instead of aborting the runner). Hence host tests work
# even with `panic = "abort"` in dev/release. Do not declare `panic` here: it only
# produces a warning.
