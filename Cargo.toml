[package]
name = "yorunix"
version = "0.0.1"
edition = "2021"
description = "YoRunix microkernel core in Rust (no_std, 32-bit x86), linked with NASM stubs"
license = "BSD 3-Clause"

[lib]
name = "yorunix"
crate-type = ["staticlib"]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = 2

# Nota: o cargo ignora `panic` no perfil `test` e força unwind — o harness do
# libtest precisa dele para relatar falhas (um assert falho registra o teste
# como falho em vez de abortar o runner). Por isso os testes de host funcionam
# mesmo com `panic = "abort"` em dev/release. Não declare `panic` aqui: só
# gera warning.
